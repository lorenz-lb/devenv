services:
  dev:
    container_name: my-container 
    build:
      context: .
      target: python

    userns_mode: keep-id

    environment:
        HOME: /home/debian
    working_dir: /workspace
    
    volumes:
      - .:/workspace

    ports:
      - "8080:8080"
      - "5678:5678"

    tty: true
    stdin_open: true
